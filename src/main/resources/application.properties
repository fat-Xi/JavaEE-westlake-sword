spring.application.name=westlake-sword
spring.datasource.url=jdbc:mysql://localhost:3306/westlake_sword?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# 行锁串行化后读取最新已提交数据，避免默认可重复读快照遗漏刚提交的名额或日程。
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=always

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.demo=${APP_DEMO:true}
app.upload=${APP_UPLOAD:uploads}
